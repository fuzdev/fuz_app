# Runs the Deno and Bun legs of the cross-backend suites on the latest release
# of each runtime, weekly. `check.yml`'s `cross-ts` job pins both to the
# versions the suites are green on; this workflow is where a newer runtime that
# changed a behavior the suites assert shows up first. It gates nothing: it
# runs on a schedule and by hand, never on a push or a pull request. A red run
# means "re-measure and bump the pins", not "the branch is broken".

name: cross-canary

on:
  schedule:
    # Mondays 06:17 UTC
    - cron: '17 6 * * 1'
  # Allow running it by hand from the Actions tab.
  workflow_dispatch:

# Least privilege: the run only reads the repo.
permissions:
  contents: read

jobs:
  latest-runtimes:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Use Node.js 24.14
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.14'
          cache: npm
      # The newest stable Deno 2 release.
      - name: Install Deno (latest)
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      # With no version argument the install script fetches the latest release.
      - name: Install Bun (latest)
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      # Recorded in the log: these are the versions a red or green run speaks for.
      - name: Show runtime versions
        run: |
          node --version
          deno --version
          bun --version
      - run: npm ci
      - run: npx svelte-kit sync
      # The Node leg is left to the gating job, where Node is pinned as it is here.
      - run: FUZ_TEST_CROSS_BACKEND=1 npx vitest run --project cross_backend_ts_deno --project cross_backend_ts_bun
